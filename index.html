var skb=document.createElement('div');skb.className='cd t';

skb.querySelector('.sk').appendChild(cv);

/* ---------- konfirmasi inline buatan sendiri ---------- */
function cfHost(id,el,label,msg,yes,cls){

/* ---------- render ---------- */
function idc(){return'<div class="cd t"><b>🪪 Identitas</b>'+[['n','Nama lengkap'],['k','Kelas (contoh: X AK 1)'],['a','No. absen']].map(function(x){var k=x[0];return'<label class="f'+(E[k]?' bad':'')+'">'+x[1]+'<input data-i="'+k+'" value="'+esc(S.id[k])+'"'+(k=='a'?' inputmode="numeric"':'')+' autocomplete="off">'+(E[k]?'<em>'+E[k]+'</em>':'')+'</label>'}).join('')+'</div>'}
function fld(f){var k=f.k;return'<label class="f'+(E[k]?' bad':'')+'">'+f.l+(f.h?'<span class="hn">'+f.h+'</span>':'')+'<textarea data-k="'+k+'" rows="2" placeholder="Tulis dengan kata-katamu sendiri...">'+esc(S.a[k]||'')+'</textarea>'+(E[k]?'<em>'+E[k]+'</em>':'')+'</label>'}
function mat(i){var p=P[i];return'<h2>'+p.i+' '+p.t+'</h2>'+(i==0?'<div class="cd"><b>Selamat datang!</b><p>Baca semua materi dulu, lalu lulus Cek Pemahaman (benar minimal 9 dari 10) untuk membuka Tugas Mandiri. Tombol Lanjut aktif setelah 5 detik di tiap halaman. Jawabanmu tersimpan otomatis.</p></div>'+idc():'')+p.c.map(function(c){return'<div class="cd'+(c[2]?' t':'')+'"><b>'+c[0]+'</b><p>'+c[1]+'</p></div>'}).join('')}
function sh(){var a=[0,1,2,3];for(var i=3;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function qi(){var q=S.q;if(!q.o||q.o.length<10){q.s=[];q.l=[];q.w=[];q.o=[];for(var i=0;i<10;i++){q.s[i]=-1;q.l[i]=false;q.w[i]=false;q.o[i]=sh()}}}

Q.forEach(function(x,i){h+='<div class="cd'+(q.l[i]?' ok':q.w[i]?' no':'')+'"><b>'+(i+1)+'. '+x[0]+'</b>';
q.o[i].forEach(function(oi){h+='<label class="op"><input type="radio" name="q'+i+'" value="'+oi+'"'+(q.s[i]==oi?' checked':'')+(q.l[i]?' disabled':'')+'><span>'+x[1][oi]+'</span></label>'});
h+=q.l[i]?'<p class="g">✅ Benar dan terkunci</p>':q.w[i]?'<p class="r">❌ Belum tepat. Petunjuk: '+x[2]+'</p>':'';h+='</div>'});
return h+'<button class="bt cy" data-a="ck" style="width:100%">Periksa Jawaban</button>'}
function chk(){qi();var q=S.q,kosong=[];Q.forEach(function(_,i){if(!q.l[i]&&q.s[i]<0)kosong.push(i+1)});
if(kosong.length)return toast('Soal nomor '+kosong.join(', ')+' belum dijawab.');
q.t++;Q.forEach(function(_,i){if(q.l[i])return;if(q.s[i]===0){q.l[i]=true;q.w[i]=false}else{q.w[i]=true;q.s[i]=-1;q.o[i]=sh()}});
q.h.push(lk());saveNow();render();window.scrollTo(0,0);
toast(passed()?'Lulus! Kamu boleh membuka Tugas Mandiri 🎉':'Benar '+lk()+'/10. Butuh minimal 9. Perbaiki soal merah.')}
function task(){var h='<h2>🗺️ Misi: Dua Jalan Menuju Rumah</h2><div class="cd"><b>Peta perjalanan</b><p>Minyak bumi sampai sebagai bensin di motor Daeng Ralla. Batu bara sampai sebagai listrik di rumah Daeng Sangkala. Isi tiap pos dengan <b>kata-katamu sendiri</b> (tempel teks dinonaktifkan). Boleh membuka materi lewat tombol Kembali.</p></div>'+idc(),g='';
F.forEach(function(f){if(f.g!=g){g=f.g;h+='<h3>'+g+'</h3>'+(GI[g]?'<div class="cd t"><p>'+GI[g]+'</p></div>':'')}h+=fld(f)});
return h+'<div id="cvh"></div>'}
function rep(pb){var q=S.q,n=comp(),h='<div class="rp"><h2>TM 2 – Sumber Energi Tidak Dapat Diperbarui (Minyak Bumi dan Batu Bara)</h2><p><b>Nama:</b> '+esc(S.id.n)+' · <b>Kelas:</b> '+esc(S.id.k)+' · <b>No. Absen:</b> '+esc(S.id.a)+'</p><p><b>Skor Cek Pemahaman:</b> '+lk()+'/10 · <b>Percobaan:</b> '+q.t+' · <b>Pindah tab/aplikasi:</b> '+S.tb+' kali · <b>Kelengkapan:</b> '+n.pct+'% ('+n.d+'/'+n.t+' kolom)</p>',g='';
F.forEach(function(f){if(f.g!=g){g=f.g;h+='<h3>'+g+'</h3>'}h+='<div><b>'+f.l+'</b></div><div class="a">'+esc(S.a[f.k]||'(kosong)')+'</div>'+(pb?'<div class="kn">🔑 Kunci ringkas: '+KN[f.k]+'</div>':'')});

setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();busy=false},3000)}
